[tool.briefcase]
project_name = "PyGooey"
bundle = "com.example"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]

[tool.briefcase.app.pygooey]
formal_name = "PyGooey"
description = "A small cross-platform desktop application built with Toga."
sources = [
    "src/pygooey",
]
test_sources = [
    "tests",
]
test_requires = [
    "pytest>=8,<9",
    "toga-dummy~=0.5.6",
]

# Keep the platform backend explicit. Briefcase will use the Linux backend on
# Linux and the Windows backend when this project is built on Windows.
[tool.briefcase.app.pygooey.linux]
requires = [
    "toga-gtk~=0.5.6",
]

[tool.briefcase.app.pygooey.windows]
requires = [
    "toga-winforms~=0.5.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
